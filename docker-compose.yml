# version: '3.8'

services:
  # etl:
  #   # build: ./etl
  #   image: python:3.11-slim
  #   container_name: pl_etl
  #   volumes:
  #     - ./etl:/app
  #   env_file:
  #     - .env
  #   depends_on:
  #     - postgres
        
  postgres:
    image: postgres:16
    container_name: pl_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      # SAFE: Written directly to your local D:\ project folder
      - ./postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # dbt:
  #   # build: ./dbt
  #   image: ghcr.io/dbt-labs/dbt-postgres:1.8.latest
  #   container_name: pl_dbt
  #   volumes:
  #     - ./dbt:/usr/app/dbt
  #   environment:
  #     - DBT_PROFILES_DIR=/usr/app/dbt
  #   depends_on:
  #     - postgres

  metabase:
    image: metabase/metabase:latest
    container_name: pl_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    volumes:
      # SAFE: Written directly to your local D:\ project folder
      - ./metabase_data:/metabase-data
    depends_on:
      - postgres

  airflow-webserver:
      build: ./airflow
      # image: apache/airflow:2.9.1-python3.11
      container_name: pl_airflow_webserver
      restart: always
      environment:
        - AIRFLOW__CORE__LOAD_EXAMPLES=False
        - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
        - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
        - _AIRFLOW_WWW_USER_USERNAME=admin
        - _AIRFLOW_WWW_USER_PASSWORD=admin
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./etl:/opt/airflow/etl
        - ./dbt:/opt/airflow/dbt
      ports:
        - "8080:8080"
      command: webserver
      depends_on:
        - postgres

  airflow-scheduler:
    build: ./airflow
    # image: apache/airflow:2.9.1-python3.11
    container_name: pl_airflow_scheduler
    restart: always
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./dbt:/opt/airflow/dbt
    command: scheduler
    depends_on:
      - postgres

