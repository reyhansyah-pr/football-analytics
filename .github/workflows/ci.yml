name: Data Pipeline CI/CD Quality Gate

# 1. Define when this automation should trigger
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Check Python Code Quality
  python-lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install light testing libraries and any required execution scripts
          pip install flake8 pytest
          if [ -f airflow/requirements.txt ]; then pip install -r airflow/requirements.txt; fi

      - name: Lint with flake8 (Check PEP 8 Syntax Errors)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all warnings as advice so the build doesn't crash on simple spacing
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Job 2: Validate dbt Models Configuration
  dbt-compilation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stable dbt adapter
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core>=1.8.0,<1.9.0" "dbt-postgres>=1.8.0,<1.9.0"

      - name: Verify dbt Project Compilation
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        run: |
          cd dbt
          # dbt parse compiles your profiles.yml and schema structure without needing 
          # to actively hit your local live docker database, catching typos instantly!
          dbt parse --profiles-dir .