name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/football-analytics
            # sudo chown -R $USER:$USER ~/football-analytics/dbt ~/football-analytics/airflow ~/football-analytics/etl #restore ownership on user root only for dbt / python / airflow
            # Fetch latest changes from main
            git fetch origin main
            git reset --hard origin/main

            # Ensure container has full write access to dbt output directories
            # sudo chmod -R 777 ~/football-analytics/dbt

            # Run dbt
            docker exec pl_airflow_scheduler bash -c "cd dbt && dbt build --log-path /opt/airflow/logs/dbt_logs"