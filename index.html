<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Analytics Dashboard | Reyhansyah Prawira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --header-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --badge-bg: rgba(51, 65, 85, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 24px; 
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); 
            z-index: 10;
            gap: 16px;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-container h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.02em;
            color: var(--text-primary); 
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tech-stack { 
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tech-badge {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-links { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        .btn-link { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary); 
            text-decoration: none; 
            font-size: 0.8rem; 
            font-weight: 500; 
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-link:hover { 
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .iframe-wrapper { 
            flex: 1;
            position: relative;
            width: 100%;
            background-color: var(--bg-color);
        }

        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #38bdf8;
            animation: spin 1s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        iframe { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            z-index: 2;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; }
            .action-links { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-section">
            <div class="title-container">
                <h1>Premier League Analytics Dashboard</h1>
                <!-- <span class="live-indicator"><span class="pulse-dot"></span> Live Data</span> -->
            </div>
            <div class="tech-stack">
                <span class="tech-badge">GCP</span>
                <span class="tech-badge">Docker</span>
                <span class="tech-badge">PostgreSQL</span>
                <span class="tech-badge">Airflow</span>
                <span class="tech-badge">dbt</span>
                <span class="tech-badge">Metabase</span>
            </div>
        </div>

        <nav class="action-links">
            <a href="https://github.com/reyhansyah-pr/football-analytics" target="_blank" class="btn-link">
                <img src="https://cdn.simpleicons.org/github/white" width="16" height="16" alt="GitHub" />
                GitHub Code
            </a>
            </a>
            <a href="https://medium.com" target="_blank" class="btn-link">
                <img src="https://cdn.simpleicons.org/medium/white" width="16" height="16" alt="Medium" />
                Article
            </a>
            <a href="https://www.youtube.com/@reyhansyaah" target="_blank" class="btn-link">
                <img src="https://cdn.simpleicons.org/youtube" width="16" height="16" alt="GitHub" />
                Demo Video
            </a>
        </nav>
    </header>

    <div class="iframe-wrapper">
        <div class="spinner"></div>
        <iframe 
            src="https://cold-boat-fbbb.reyhansyah-business.workers.dev/public/dashboard/d46d0dd1-5b71-4132-953f-607eae7a6d73#theme=night"
            allowtransparency>
        </iframe>
    </div>

</body>
</html>
